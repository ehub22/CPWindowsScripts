name: Regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and test helpers with Windows PowerShell 5.1
        shell: powershell
        run: |
          try {
              ./tests/regression.ps1
          } catch {
              $errLine = $_.InvocationInfo.ScriptLineNumber
              $errFile = $_.InvocationInfo.ScriptName
              $msg = $_.Exception.Message -replace "`r|`n", ' '
              Write-Host "::error file=$errFile,line=$errLine::$msg"
              throw
          }
      - name: Run PSScriptAnalyzer checks
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          }
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery | Out-Null
          }
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $targets = @('secure.ps1') + @(Get-ChildItem -Path 'modules' -Filter '*.ps1' | Select-Object -ExpandProperty FullName)
          $issues = @()
          foreach ($t in $targets) {
              $issues += @(Invoke-ScriptAnalyzer -Path $t -Settings '.\.PSScriptAnalyzerSettings.psd1')
          }
          if ($issues.Count -gt 0) {
              foreach ($iss in $issues) {
                  $msg = ("[$($iss.Severity) $($iss.RuleName)] $($iss.Message)") -replace "`r|`n", ' '
                  Write-Host "::error file=$($iss.ScriptPath),line=$($iss.Line)::$msg"
              }
              $issues | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize | Out-String | Write-Host
              throw ("PSScriptAnalyzer reported " + $issues.Count + " issue(s).")
          }
          Write-Host 'PSScriptAnalyzer passed with zero errors/warnings.'
